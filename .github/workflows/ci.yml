name: Cloud Resume CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda_code/requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Debug GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository owner ID:", payload.repository_owner_id);
            console.log("Ref:", payload.ref);

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943273443831:role/GitHubActions-CloudResume-Deploy
          aws-region: af-south-1

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM validate
        run: |
          sam validate --region af-south-1

      - name: SAM build
        run: |
          sam build

      - name: SAM deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sam deploy \
            --stack-name cloud-resume-backend \
            --region af-south-1 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset