name: Cloud Resume CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1
  STACK_NAME: cloud-resume-challenge

jobs:

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda_code/requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943273443831:role/GitHubActions-CloudResume-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: |
          sam validate --template-file template.yaml --region ${{ env.AWS_REGION }}

      - name: Build SAM application
        run: |
          sam build --template-file template.yaml

      - name: Deploy CloudFormation stack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3