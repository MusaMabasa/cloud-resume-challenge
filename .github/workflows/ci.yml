name: Cloud Resume CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda_code/requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943273443831:role/GitHubActions-CloudResume-Deploy
          aws-region: af-south-1

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM validate
        run: |
          sam validate --region af-south-1

      - name: SAM build
        run: |
          sam build